services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeline
      POSTGRES_PASSWORD: forgeline_secret
      POSTGRES_DB: forgeline_dev
    ports:
      - "5432:5432"
    volumes:
      - forgeline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeline -d forgeline_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: forgeline-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeline
      POSTGRES_PASSWORD: forgeline_secret
      POSTGRES_DB: forgeline_test
    ports:
      - "5433:5432"
    volumes:
      - forgeline_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeline -d forgeline_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forgeline_pgdata:
  forgeline_test_pgdata:
